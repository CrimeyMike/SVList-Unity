name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Unity licensing secrets are required for GameCI to run at all. Until they
# are configured (one-time setup, see the notice below) every run would fail
# after ~90s and spam the inbox - so the test job is gated and skipped instead.
jobs:
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    outputs:
      has-license: ${{ steps.check.outputs.has-license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "has-license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity license secrets (UNITY_LICENSE, or UNITY_EMAIL+UNITY_PASSWORD) are not configured - skipping EditMode tests. One-time setup: https://game.ci/docs/github/activation"
          fi

  editmode-tests:
    name: EditMode tests (${{ matrix.unityVersion }})
    needs: license-check
    if: needs.license-check.outputs.has-license == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unityVersion: [2022.3.16f1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the GameCI Unity test runner.
      # Requires repository secrets: UNITY_LICENSE (or UNITY_EMAIL + UNITY_PASSWORD).
      # See https://game.ci/docs/github/test-runner for the one-time setup (~3 minutes).
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          unityVersion: ${{ matrix.unityVersion }}
          projectPath: .
          # Tests live inside the package; testables are declared in Packages/manifest.json
          customParameters: -enableCodeCoverage -codeCoverageOptions useProjectSettings
          artifactsPath: test-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (${{ matrix.unityVersion }})
          path: ${{ steps.tests.outputs.artifactsPath }}
