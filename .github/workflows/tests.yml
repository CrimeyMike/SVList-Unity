name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  editmode-tests:
    name: EditMode tests (${{ matrix.unityVersion }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unityVersion: [2022.3.16f1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the GameCI Unity test runner.
      # Requires repository secrets: UNITY_LICENSE (or UNITY_EMAIL + UNITY_PASSWORD).
      # See https://game.ci/docs/github/test-runner for the one-time setup (~3 minutes).
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          unityVersion: ${{ matrix.unityVersion }}
          projectPath: .
          # Tests live inside the package; testables are declared in Packages/manifest.json
          customParameters: -enableCodeCoverage -codeCoverageOptions useProjectSettings
          artifactsPath: test-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (${{ matrix.unityVersion }})
          path: ${{ steps.tests.outputs.artifactsPath }}
